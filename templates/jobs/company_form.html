{% extends 'base.html' %}

{% block title %}Edit Company - JobPortal{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="card p-6 sm:p-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Company Profile</h2>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8">
                <div class="sm:col-span-2">
                    <label for="id_name" class="block text-sm font-medium text-gray-700">Company Name</label>
                    <div class="mt-1">
                        <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" required class="input-field">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="id_description" class="block text-sm font-medium text-gray-700">Description</label>
                    <div class="mt-1">
                        <textarea name="description" id="id_description" rows="5" class="input-field">{{ form.description.value|default:'' }}</textarea>
                    </div>
                </div>

                <div>
                    <label for="id_location" class="block text-sm font-medium text-gray-700">Location</label>
                    <div class="mt-1">
                        <input type="text" name="location" id="id_location" value="{{ form.location.value|default:'' }}" class="input-field">
                    </div>
                </div>
                
                <div>
                    <label for="id_website" class="block text-sm font-medium text-gray-700">Website</label>
                    <div class="mt-1">
                        <input type="url" name="website" id="id_website" value="{{ form.website.value|default:'' }}" class="input-field">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="id_logo" class="block text-sm font-medium text-gray-700">Logo</label>
                    <div class="mt-1 flex items-center">
                        {% if form.instance.logo %}
                            <span class="inline-block h-12 w-12 rounded-full overflow-hidden bg-gray-100 mr-3">
                                <img src="{{ form.instance.logo.url }}" alt="Logo" class="h-full w-full object-cover">
                            </span>
                        {% endif %}
                        <input type="file" name="logo" id="id_logo" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-100 space-x-3">
                <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
