{% extends 'base.html' %}

{% block title %}Delete Job - JobPortal{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="card p-6 sm:p-8 text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Delete Job</h2>
        <p class="text-gray-500 mb-6">Are you sure you want to delete the job "<strong>{{ object.title }}</strong>"? This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center space-x-4 pt-4">
                <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-danger">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
