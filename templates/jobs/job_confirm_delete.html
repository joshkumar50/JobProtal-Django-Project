{% extends 'base.html' %}

{% block title %}Delete Job - JobPortal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 py-12">
    <div class="card p-6 sm:p-8 text-center">
        <div class="w-12 h-12 rounded-full bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </div>

        <h1 class="text-xl font-bold text-slate-900 mb-2 tracking-tight">Delete Job Opening</h1>
        <p class="text-sm text-slate-600 mb-6 leading-relaxed">
            Are you sure you want to remove <span class="font-semibold text-slate-900">"{{ object.title }}"</span>? This will permanently delete the opening and cannot be undone.
        </p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex flex-col-reverse sm:flex-row items-center justify-center gap-3 pt-2">
                <a href="{% url 'dashboard' %}" class="btn-outline w-full sm:w-auto">Cancel</a>
                <button type="submit" class="btn-danger w-full sm:w-auto">
                    Confirm Deletion
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
