{% extends 'base.html' %}

{% block title %}Register - JobPortal{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 card p-10">
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900">Create an account</h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Already have an account?
                <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
                    Sign in
                </a>
            </p>
        </div>
        <form class="mt-8 space-y-6" action="" method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="mt-1 text-sm text-red-600">{{ field.errors.0 }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div>
                <button type="submit" class="btn-primary w-full">
                    Sign up
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
